[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
known_first_party = ["services", "routes", "models"]

[tool.flake8]
max-line-length = 120
extend-ignore = "E203,E402,E501,E731,W503,F401,F821,F841,F541,E712"
exclude = ".git,__pycache__,.venv,venv,migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
