[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
known_first_party = ["services", "routes", "models"]

[tool.flake8]
max-line-length = 120
extend-ignore = "E203,E501"
exclude = [".git,__pycache__,.venv,venv,migrations"]
