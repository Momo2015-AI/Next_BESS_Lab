<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>SOH-SIM Design System — Showcase</title>
  <style>
    body { background: #f8fafc; margin: 0; padding: 32px 24px; font-family: 'Inter', system-ui, sans-serif; color: #0f172a; }
    .container { max-width: 1120px; margin: 0 auto; }
    h1.title { font-size: 28px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.02em; }
    p.lede { color: #64748b; font-size: 13px; margin: 0 0 32px; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">设计规范预览</h1>
    <p class="lede">这里只展示 SectionCard + FormField 组件的样式，与新设计稿对齐。功能页改造会基于此规范进行。</p>
    <div id="app"></div>
  </div>

  <script type="module">
    import { createApp, h } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'
    import SectionCard from '/src/components/SectionCard.vue'
    import FormField from '/src/components/FormField.vue'
    import '/src/style.css'

    // Inline FormField + SectionCard runtime templates (Vite compiles SFC — we replicate the rendered structure manually here)
    const Field = {
      props: ['label', 'required', 'type', 'modelValue', 'placeholder', 'options'],
      emits: ['update:modelValue'],
      setup(props, { emit }) {
        return () => h('div', { class: 'form-field' }, [
          props.label ? h('label', { class: 'form-field-label' }, [
            h('span', props.label),
            props.required ? h('span', { class: 'required' }, '*') : null
          ]) : null,
          props.type === 'select'
            ? h('select', {
                class: 'form-field-select',
                value: props.modelValue ?? '',
                onChange: e => emit('update:modelValue', e.target.value)
              }, [
                props.placeholder ? h('option', { value: '', disabled: true }, props.placeholder) : null,
                ...(props.options || []).map(o => h('option', { value: o.value ?? o }, (o.label ?? o)))
              ])
            : h('input', {
                class: 'form-field-input',
                type: props.type || 'text',
                placeholder: props.placeholder,
                value: props.modelValue ?? '',
                onInput: e => emit('update:modelValue', e.target.value)
              })
        ])
      }
    }

    const Section = {
      props: ['number', 'title', 'subtitle'],
      setup(props, { slots }) {
        return () => h('section', { class: 'section-card' }, [
          h('header', { class: 'section-card-header' }, [
            h('span', { class: 'section-number-badge' }, props.number),
            h('span', { class: 'section-divider' }),
            h('h2', { class: 'section-title' }, props.title)
          ]),
          props.subtitle ? h('p', { class: 'section-subtitle' }, props.subtitle) : null,
          slots.default ? slots.default() : null
        ])
      }
    }

    const App = {
      components: { Section, Field },
      setup() {
        const data = Vue.ref({
          name: 'Project Name', type: '', location: 'Location',
          mw: 200, mwh: 800, hours: 4, cycles: 1
        })
        return () => h('div', null, [
          h(Section, { number: '01', title: 'Project Overview' }, () => h('div', { class: 'form-grid-4' }, [
            h(Field, { label: 'Project Name', required: true, modelValue: data.value.name, 'onUpdate:modelValue': v => data.value.name = v }),
            h(Field, { label: 'Project Type', type: 'select', modelValue: data.value.type, placeholder: 'Please select', options: ['独立储能','工商业','光储','风储'], 'onUpdate:modelValue': v => data.value.type = v }),
            h(Field, { label: 'Location', modelValue: data.value.location, 'onUpdate:modelValue': v => data.value.location = v }),
            h(Field, { label: 'Daily Cycles', type: 'number', modelValue: data.value.cycles, 'onUpdate:modelValue': v => data.value.cycles = v })
          ])),
          h(Section, { number: '02', title: 'Site & Environment' }, () => h('div', { class: 'form-grid-4' }, [
            h(Field, { label: 'Altitude m', type: 'number', placeholder: '≤ 2000', modelValue: '', 'onUpdate:modelValue': () => {} }),
            h(Field, { label: 'Extreme Max Temp °C', type: 'number', placeholder: '45', modelValue: '45', 'onUpdate:modelValue': () => {} }),
            h(Field, { label: 'Extreme Min Temp °C', type: 'number', placeholder: '-20', modelValue: '-20', 'onUpdate:modelValue': () => {} }),
            h(Field, { label: 'Annual Avg Temp °C', type: 'number', placeholder: '25', modelValue: '25', 'onUpdate:modelValue': () => {} }),
            h(Field, { label: 'Relative Humidity %RH', type: 'number', placeholder: '≤ 95', modelValue: '', 'onUpdate:modelValue': () => {} }),
            h(Field, { label: 'Seismic Zone', type: 'select', placeholder: 'Please select', options: ['Zone I', 'Zone III', 'Zone IV'], modelValue: '', 'onUpdate:modelValue': () => {} }),
            h(Field, { label: 'Corrosion Level', type: 'select', modelValue: 'C3', options: [{label: 'C3 (Medium)', value: 'C3'}], 'onUpdate:modelValue': () => {} }),
            h(Field, { label: 'Installation Type', type: 'select', placeholder: 'Please select', options: ['户外','户内','半户外'], modelValue: '', 'onUpdate:modelValue': () => {} })
          ])),
          h(Section, { number: '03', title: 'Grid & Electrical' }, () => h('div', { class: 'form-grid-4' }, [
            h(Field, { label: 'Grid Voltage Level kV', type: 'select', placeholder: 'Please select', options: ['35','110','220','500'], modelValue: '', 'onUpdate:modelValue': () => {} }),
            h(Field, { label: 'Grid Frequency Hz', type: 'select', placeholder: 'Please select', options: ['50','60'], modelValue: '', 'onUpdate:modelValue': () => {} }),
            h(Field, { label: 'Short-Circuit Capacity MVA', type: 'number', placeholder: '5000', modelValue: '5000', 'onUpdate:modelValue': () => {} }),
            h(Field, { label: 'Neutral Grounding', type: 'select', placeholder: 'Please select', options: ['Solid','Resistance','Arc-Suppression'], modelValue: '', 'onUpdate:modelValue': () => {} }),
            h(Field, { label: 'DC Rated Voltage Range V', placeholder: '1000~1500', modelValue: '1000~1500', 'onUpdate:modelValue': () => {} }),
            h(Field, { label: 'AC Rated Voltage V', type: 'number', placeholder: '690', modelValue: '690', 'onUpdate:modelValue': () => {} }),
            h(Field, { label: 'Power Factor Range', placeholder: '0.99leading~0.99lagging', modelValue: '0.99leading~0.99lagging', 'onUpdate:modelValue': () => {} }),
            h(Field, { label: 'THDi Requirement %', type: 'number', placeholder: '5', modelValue: '5', 'onUpdate:modelValue': () => {} })
          ])),
          h(Section, { number: '04', title: 'Performance KPIs' }, () => h('div', { class: 'form-grid-4' }, [
            h(Field, { label: 'RTE Target Year 1 %', type: 'number', placeholder: '88', modelValue: '88', 'onUpdate:modelValue': () => {} }),
            h(Field, { label: 'AC Availability %', type: 'number', placeholder: '97', modelValue: '97', 'onUpdate:modelValue': () => {} }),
            h(Field, { label: 'SOH End of Year 1 %', type: 'number', placeholder: '96', modelValue: '96', 'onUpdate:modelValue': () => {} }),
            h(Field, { label: 'SOH End of Year 25 %', type: 'number', placeholder: '70', modelValue: '70', 'onUpdate:modelValue': () => {} })
          ]))
        ])
      }
    }
    window.Vue = { ref: Vue.ref, reactive: Vue.reactive }
    createApp(App).mount('#app')
  </script>
</body>
</html>
