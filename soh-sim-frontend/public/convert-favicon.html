<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Favicon 转换器</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 40px auto; padding: 20px; }
    .step { margin: 20px 0; padding: 16px; border: 1px solid #ddd; border-radius: 8px; }
    button { padding: 10px 24px; background: #863bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { color: #666; margin-top: 12px; }
    .preview { display: flex; gap: 16px; align-items: flex-end; margin-top: 12px; }
    .preview img { border: 1px solid #eee; background: #f5f5f5; }
    .preview div { text-align: center; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <h1>SVG → ICO 转换器</h1>

  <div class="step">
    <p><strong>源文件：</strong><code>public/favicon.svg</code></p>
    <div class="preview">
      <div><img id="svg-preview" src="favicon.svg" width="48" height="46"><br>SVG 原始</div>
    </div>
  </div>

  <div class="step">
    <p>点击按钮生成多尺寸 ICO 文件（16×16 + 32×32 + 48×48）并自动下载：</p>
    <button id="convert-btn" onclick="convert()">转换为 favicon.ico</button>
    <div id="status"></div>
    <div id="previews" class="preview"></div>
  </div>

  <script>
    function status(msg) {
      document.getElementById('status').textContent = msg;
    }

    function createPngBlob(canvas) {
      return new Promise(resolve => {
        canvas.toBlob(blob => resolve(blob), 'image/png');
      });
    }

    async function canvasToUint8(canvas) {
      const blob = await createPngBlob(canvas);
      const buf = await blob.arrayBuffer();
      return new Uint8Array(buf);
    }

    function buildIco(pngs) {
      // ICO format: header + icon entries + icon data
      const count = pngs.length;
      const headerSize = 6;
      const entrySize = 16;

      // Calculate offsets
      const offsets = [];
      let offset = headerSize + count * entrySize;
      for (const png of pngs) {
        offsets.push(offset);
        offset += png.length;
      }

      const total = offset;
      const buf = new ArrayBuffer(total);
      const dv = new DataView(buf);
      const u8 = new Uint8Array(buf);

      // Header
      dv.setUint16(0, 0, true);      // reserved
      dv.setUint16(2, 1, true);      // type: ICO
      dv.setUint16(4, count, true);  // count

      // Entries
      for (let i = 0; i < count; i++) {
        const base = headerSize + i * entrySize;
        dv.setUint8(base, 0);       // width (0 = 256)
        dv.setUint8(base + 1, 0);   // height (0 = 256)
        dv.setUint8(base + 2, 0);   // colors
        dv.setUint8(base + 3, 0);   // reserved
        dv.setUint16(base + 4, 1, true);  // planes
        dv.setUint16(base + 6, 32, true); // bpp
        dv.setUint32(base + 8, pngs[i].length, true); // size
        dv.setUint32(base + 12, offsets[i], true);     // offset

        // Write actual dimensions into first two bytes
        if (i === 0) { dv.setUint8(base, 16); dv.setUint8(base + 1, 16); }
        if (i === 1) { dv.setUint8(base, 32); dv.setUint8(base + 1, 32); }
        if (i === 2) { dv.setUint8(base, 48); dv.setUint8(base + 1, 48); }
      }

      // PNG data
      for (let i = 0; i < count; i++) {
        u8.set(pngs[i], offsets[i]);
      }

      return new Blob([buf], { type: 'image/x-icon' });
    }

    async function convert() {
      const btn = document.getElementById('convert-btn');
      btn.disabled = true;
      status('正在加载 SVG...');

      try {
        const res = await fetch('favicon.svg');
        const svgText = await res.text();

        status('正在渲染 3 种尺寸...');
        const sizes = [16, 32, 48];
        const pngs = [];
        const previewsDiv = document.getElementById('previews');
        previewsDiv.innerHTML = '';

        for (const size of sizes) {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');

          const img = new Image();
          const blob = new Blob([svgText], { type: 'image/svg+xml' });
          const url = URL.createObjectURL(blob);

          await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = reject;
            img.src = url;
          });

          ctx.drawImage(img, 0, 0, size, size);
          URL.revokeObjectURL(url);

          pngs.push(await canvasToUint8(canvas));

          // Preview
          const div = document.createElement('div');
          const previewImg = document.createElement('img');
          previewImg.src = canvas.toDataURL('image/png');
          previewImg.width = size;
          previewImg.height = size;
          div.appendChild(previewImg);
          div.appendChild(document.createTextNode(size + '×' + size));
          previewsDiv.appendChild(div);
        }

        status('正在生成 ICO...');
        const ico = buildIco(pngs);

        // Download
        const downloadUrl = URL.createObjectURL(ico);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = 'favicon.ico';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);

        status('✅ 成功！favicon.ico 已下载 (16+32+48px)，请把它放入 public/ 目录。');
      } catch (err) {
        status('❌ 失败: ' + err.message);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
