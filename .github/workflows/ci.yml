name: CI

on:
  push:
    branches: [main, develop, ENG0709]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./soh-sim-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: soh-sim-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format code with Prettier
        run: npm run format

      - name: Lint and auto-fix with ESLint
        run: npm run lint

      - name: Verify no remaining errors
        run: npm run lint:no-fix

      - name: Verify formatting is clean
        run: npm run format:check

      - name: TypeScript check
        run: npm run type-check
        continue-on-error: true

      - name: Run frontend tests
        run: npx vitest run
        continue-on-error: true

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./soh-sim-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install flask flask-cors flask-limiter flask-sqlalchemy numpy pandas plotly openpyxl PyJWT reportlab scipy requests
          pip install black isort flake8 pytest pytest-cov pytest-flask

      - name: Black check
        run: black --check .

      - name: isort check
        run: isort --check-only .

      - name: Flake8
        run: flake8

      - name: Run backend tests
        run: pytest --tb=short
        env:
          SECRET_KEY: "ci-test-secret-key-2026"
          TEST_DATABASE_URI: "sqlite:///:memory:"

  rules-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check AI rules consistency
        run: node scripts/check-ai-rules-consistency.js

      - name: Check code style
        run: bash scripts/check-code-style.sh
        continue-on-error: true
