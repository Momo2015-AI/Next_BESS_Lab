name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: ./soh-sim-frontend
      - run: npm run lint
        working-directory: ./soh-sim-frontend
      - run: npm run format -- --check
        working-directory: ./soh-sim-frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install black isort flake8
        working-directory: ./soh-sim-backend
      - run: black --check .
        working-directory: ./soh-sim-backend
      - run: isort --check-only .
        working-directory: ./soh-sim-backend
      - run: flake8
        working-directory: ./soh-sim-backend
